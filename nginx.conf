server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Long cache for hashed build assets, never cache index.html
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /index.html { add_header Cache-Control "no-store"; }

  # Needed only when VITE_ROUTER=browser (clean URLs)
  location / { try_files $uri $uri/ /index.html; }

  # Optional: proxy the FastAPI backend so the browser never needs CORS.
  # Uncomment and point to your FastAPI service, then build with VITE_API_BASE_URL=/api/v1
  # location /api/ {
  #   proxy_pass http://backend:8000;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   client_max_body_size 12m;   # image uploads up to 10 MB
  # }
}
